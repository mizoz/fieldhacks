<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5f6a66"/></marker><filter id="veg" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 0.20  0 0 0 0 0.36  0 0 0 0 0.16  0 0 0 -1.4 1.3"/></filter><filter id="gray" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 0.75  0 0 0 0 0.75  0 0 0 0 0.75  0 0 0 -1.4 1.3"/></filter><clipPath id="c"><rect width="150" height="150" rx="8"/></clipPath></defs>
<rect width="1000" height="440" fill="#fbfaf6"/>
<text x="40" y="40" font-size="21" font-weight="bold" fill="#1d2321">Trail Finder · concept</text>
<text x="40" y="62" fill="#5f6a66">Off-season drone or satellite image in, game trails out as map lines. Classic image processing first, no AI needed to start.</text>
<g transform="translate(40 100)"><g clip-path="url(#c)">
<rect width="150" height="150" fill="#6b8f4e"/>
<rect width="150" height="150" filter="url(#veg)"/>
<path d="M-5 120 C30 105 45 70 75 72 S120 40 155 20" stroke="#c9b48a" stroke-width="6" fill="none" opacity="0.8"/>
<path d="M75 72 C80 100 105 120 150 135" stroke="#c9b48a" stroke-width="4" fill="none" opacity="0.7"/>
<path d="M20 -5 L20 155" stroke="#d8d2c0" stroke-width="2" fill="none"/>
</g>
<text x="0" y="176" font-weight="bold" fill="#1d2321">1  Image</text>
<text x="0" y="196" fill="#5f6a66" font-size="12">orthomosaic (GeoTIFF)</text></g>
<path d="M194 175 H226" stroke="#5f6a66" stroke-width="2" fill="none" marker-end="url(#a)"/>
<g transform="translate(230 100)"><g clip-path="url(#c)">
<rect width="150" height="150" fill="#3a3a3a"/>
<rect width="150" height="150" filter="url(#gray)"/>
<path d="M-5 120 C30 105 45 70 75 72 S120 40 155 20" stroke="#1a1a1a" stroke-width="6" fill="none"/>
<path d="M75 72 C80 100 105 120 150 135" stroke="#1a1a1a" stroke-width="4" fill="none"/>
<path d="M20 -5 L20 155" stroke="#222" stroke-width="2"/>
</g>
<text x="0" y="176" font-weight="bold" fill="#1d2321">2  Vegetation index</text>
<text x="0" y="196" fill="#5f6a66" font-size="12">trails have less green</text></g>
<path d="M384 175 H416" stroke="#5f6a66" stroke-width="2" fill="none" marker-end="url(#a)"/>
<g transform="translate(420 100)"><g clip-path="url(#c)">
<rect width="150" height="150" fill="#05080a"/>
<path d="M-5 120 C30 105 45 70 75 72 S120 40 155 20" stroke="#fff" stroke-width="7" fill="none" opacity="0.35"/>
<path d="M-5 120 C30 105 45 70 75 72 S120 40 155 20" stroke="#fff" stroke-width="3" fill="none"/>
<path d="M75 72 C80 100 105 120 150 135" stroke="#fff" stroke-width="2.5" fill="none"/>
<path d="M20 -5 L20 155" stroke="#fff" stroke-width="2"/>
<path d="M100 110 l8 4 M40 30 l6 -3 M120 90 l5 5" stroke="#fff" stroke-width="2"/>
</g>
<text x="0" y="176" font-weight="bold" fill="#1d2321">3  Thin-line filter</text>
<text x="0" y="196" fill="#5f6a66" font-size="12">Frangi ridge, 0.3–1 m</text></g>
<path d="M574 175 H606" stroke="#5f6a66" stroke-width="2" fill="none" marker-end="url(#a)"/>
<g transform="translate(610 100)"><g clip-path="url(#c)">
<rect width="150" height="150" fill="#05080a"/>
<path d="M-5 120 C30 105 45 70 75 72 S120 40 155 20" stroke="#fff" stroke-width="1.6" fill="none"/>
<path d="M75 72 C80 100 105 120 150 135" stroke="#fff" stroke-width="1.6" fill="none"/>
<path d="M20 -5 L20 155" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="26" y="146" fill="#ef4444" font-size="10">straight: fence, dropped</text>
</g>
<text x="0" y="176" font-weight="bold" fill="#1d2321">4  Clean up</text>
<text x="0" y="196" fill="#5f6a66" font-size="12">skeleton, drop short + straight</text></g>
<path d="M764 175 H796" stroke="#5f6a66" stroke-width="2" fill="none" marker-end="url(#a)"/>
<g transform="translate(800 100)"><g clip-path="url(#c)">
<rect width="150" height="150" fill="#ece6d6"/>
<path d="M0 95 C40 85 60 110 150 100" stroke="#8fb3d9" stroke-width="5" fill="none"/>
<path d="M0 40 C50 30 90 55 150 45" stroke="#c9c1a8" stroke-width="1" fill="none"/>
<path d="M0 60 C50 50 90 75 150 65" stroke="#c9c1a8" stroke-width="1" fill="none"/>
<path d="M-5 120 C30 105 45 70 75 72 S120 40 155 20" stroke="#c2410c" stroke-width="3" fill="none"/>
<path d="M75 72 C80 100 105 120 150 135" stroke="#c2410c" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
<circle cx="75" cy="72" r="7" fill="none" stroke="#c2410c" stroke-width="2"/>
<text x="86" y="86" fill="#7c2d12" font-size="10">junction 0.86</text>
</g>
<text x="0" y="176" font-weight="bold" fill="#1d2321">5  Map lines</text>
<text x="0" y="196" fill="#5f6a66" font-size="12">GeoJSON + confidence</text></g>
<rect x="40" y="330" width="560" height="86" rx="10" fill="#fdf2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="54" y="354" font-weight="bold" fill="#1d2321">Why off-season</text>
<text x="54" y="376" fill="#5f6a66" font-size="12.5">Many provinces and states restrict using drones to find game, often in a window</text>
<text x="54" y="394" fill="#5f6a66" font-size="12.5">before and during the season. Map in spring, hunt in fall. Check your rules.</text>
<rect x="620" y="330" width="340" height="86" rx="10" fill="#eef1ea" stroke="#4d7c0f" stroke-width="1.5"/>
<text x="634" y="354" font-weight="bold" fill="#1d2321">Runs on</text>
<text x="634" y="376" fill="#5f6a66" font-size="12.5">any laptop (Python). Imagery: your drone via</text>
<text x="634" y="394" fill="#5f6a66" font-size="12.5">WebODM, or exported satellite tiles.</text>
<rect x="800" y="76" width="246.4" height="22" rx="11" fill="#fdecd3"/>
<text x="808" y="91" fill="#9a3412" font-size="11.5">illustration of the planned pipeline</text>
</svg>