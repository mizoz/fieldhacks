<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <!-- GND: three bars -->
    <g id="gnd" stroke="#1d2321" stroke-width="2"><path d="M0 0 V10 M-10 10 H10 M-6 15 H6 M-2 20 H2"/></g>
    <!-- +5V: bar on top -->
    <g id="vcc"><path d="M0 0 V-12 M-9 -12 H9" stroke="#b91c1c" stroke-width="2"/></g>
    <!-- SPST push button, 60 wide, left end at 0 -->
    <g id="sw" stroke="#1d2321" stroke-width="2" fill="none">
      <path d="M0 0 H18 M42 0 H60"/><circle cx="20" cy="0" r="2.5" fill="#fbfaf6"/><circle cx="40" cy="0" r="2.5" fill="#fbfaf6"/>
      <path d="M16 -9 H44 M30 -9 V-18 M24 -18 H36"/>
    </g>
  </defs>
  <rect width="1000" height="640" fill="#fbfaf6"/>
  <text x="40" y="40" font-size="21" font-weight="bold" fill="#1d2321">HoldPoint · schematic</text>
  <text x="40" y="62" fill="#5f6a66">Same circuit as the wiring picture, drawn the electrical way. Wires that end in the same label are connected.</text>

  <g stroke="#1d2321" stroke-width="2" fill="none">
    <!-- U1 Nano -->
    <rect x="420" y="130" width="190" height="340" rx="4" fill="#eef3f6"/>
    <!-- left pins -->
    <path d="M420 200 H380 M420 250 H380 M420 310 H380 M420 360 H380"/>
    <!-- right pins -->
    <path d="M610 190 H650 M610 270 H650 M610 350 H650 M610 430 H650"/>
  </g>
  <text x="515" y="152" text-anchor="middle" font-weight="bold" fill="#1d2321">U1  Arduino Nano</text>
  <text x="515" y="168" text-anchor="middle" fill="#5f6a66" font-size="12">ATmega328P · 5 V / 16 MHz</text>
  <g fill="#1d2321" font-size="12">
    <text x="428" y="204">5V</text><text x="428" y="254">GND</text><text x="428" y="314">A4 / SDA</text><text x="428" y="364">A5 / SCL</text>
    <text x="602" y="194" text-anchor="end">D2</text><text x="602" y="274" text-anchor="end">D3</text>
    <text x="602" y="354" text-anchor="end">D4</text><text x="602" y="434" text-anchor="end">GND</text>
  </g>
  <text x="515" y="402" text-anchor="middle" fill="#5f6a66" font-size="11">D2–D4: INPUT_PULLUP</text>
  <text x="515" y="417" text-anchor="middle" fill="#5f6a66" font-size="11">(≈35 kΩ inside the chip)</text>

  <!-- U1 left-side nets -->
  <use href="#vcc" x="380" y="200"/><text x="380" y="180" text-anchor="middle" fill="#b91c1c" font-size="12">+5V</text>
  <path d="M380 250 V260" stroke="#1d2321" stroke-width="2"/><use href="#gnd" x="380" y="260"/>
  <path d="M380 310 H340 M380 360 H340" stroke="#1d2321" stroke-width="2"/>
  <g font-size="12" font-weight="bold">
    <path d="M340 310 l-10 -9 h-44 v18 h44 z" fill="#dcefd8" stroke="#3f6212" stroke-width="1.5"/>
    <text x="308" y="314" text-anchor="middle" fill="#3f6212">SDA</text>
    <path d="M340 360 l-10 -9 h-44 v18 h44 z" fill="#fdecd3" stroke="#b45309" stroke-width="1.5"/>
    <text x="308" y="364" text-anchor="middle" fill="#b45309">SCL</text>
  </g>

  <!-- U2 OLED -->
  <g stroke="#1d2321" stroke-width="2" fill="none">
    <rect x="60" y="110" width="150" height="160" rx="4" fill="#eef3f6"/>
    <path d="M210 170 H240 M210 200 H240 M210 230 H240 M210 260 H240"/>
  </g>
  <text x="135" y="132" text-anchor="middle" font-weight="bold" fill="#1d2321">U2  OLED</text>
  <text x="135" y="148" text-anchor="middle" fill="#5f6a66" font-size="11">SSD1306 128×64 · I2C 0x3C</text>
  <text x="135" y="290" text-anchor="middle" fill="#5f6a66" font-size="11">4.7–10 kΩ pull-ups on board</text>
  <g fill="#1d2321" font-size="12"><text x="202" y="174" text-anchor="end">VCC</text><text x="202" y="204" text-anchor="end">GND</text>
    <text x="202" y="234" text-anchor="end">SCL</text><text x="202" y="264" text-anchor="end">SDA</text></g>
  <use href="#vcc" x="240" y="170"/><text x="240" y="152" text-anchor="middle" fill="#b91c1c" font-size="12">+5V</text>
  <path d="M240 200 H262 V207" stroke="#1d2321" stroke-width="2" fill="none"/><use href="#gnd" x="262" y="207"/>
  <g font-size="12" font-weight="bold">
    <path d="M240 230 h10 l10 -9 h44 v18 h-44 z" fill="#fdecd3" stroke="#b45309" stroke-width="1.5"/><text x="282" y="234" text-anchor="middle" fill="#b45309">SCL</text>
    <path d="M240 260 h10 l10 -9 h44 v18 h-44 z" fill="#dcefd8" stroke="#3f6212" stroke-width="1.5"/><text x="282" y="264" text-anchor="middle" fill="#3f6212">SDA</text>
  </g>

  <!-- U3 BMP280 (optional) -->
  <g stroke="#1d2321" stroke-width="2" fill="none">
    <rect x="60" y="340" width="150" height="160" rx="4" fill="#f3eefa" stroke-dasharray="6 4"/>
    <path d="M210 400 H240 M210 430 H240 M210 460 H240 M210 490 H240"/>
  </g>
  <text x="135" y="362" text-anchor="middle" font-weight="bold" fill="#1d2321">U3  BMP280</text>
  <text x="135" y="378" text-anchor="middle" fill="#5f6a66" font-size="11">optional · I2C 0x76 / 0x77</text>
  <text x="135" y="520" text-anchor="middle" fill="#5f6a66" font-size="11">5 V board with regulator</text>
  <g fill="#1d2321" font-size="12"><text x="202" y="404" text-anchor="end">VCC</text><text x="202" y="434" text-anchor="end">GND</text>
    <text x="202" y="464" text-anchor="end">SCL</text><text x="202" y="494" text-anchor="end">SDA</text></g>
  <use href="#vcc" x="240" y="400"/><text x="240" y="382" text-anchor="middle" fill="#b91c1c" font-size="12">+5V</text>
  <path d="M240 430 H262 V437" stroke="#1d2321" stroke-width="2" fill="none"/><use href="#gnd" x="262" y="437"/>
  <g font-size="12" font-weight="bold">
    <path d="M240 460 h10 l10 -9 h44 v18 h-44 z" fill="#fdecd3" stroke="#b45309" stroke-width="1.5"/><text x="282" y="464" text-anchor="middle" fill="#b45309">SCL</text>
    <path d="M240 490 h10 l10 -9 h44 v18 h-44 z" fill="#dcefd8" stroke="#3f6212" stroke-width="1.5"/><text x="282" y="494" text-anchor="middle" fill="#3f6212">SDA</text>
  </g>

  <!-- Buttons -->
  <use href="#sw" x="650" y="190"/><use href="#sw" x="650" y="270"/><use href="#sw" x="650" y="350"/>
  <g stroke="#1d2321" stroke-width="2" fill="none">
    <path d="M710 190 H760 V440 M710 270 H760 M710 350 H760 M650 430 H760"/>
  </g>
  <g fill="#1d2321"><circle cx="760" cy="270" r="4"/><circle cx="760" cy="350" r="4"/><circle cx="760" cy="430" r="4"/></g>
  <use href="#gnd" x="760" y="440"/>
  <g fill="#1d2321" font-size="12" font-weight="bold">
    <text x="680" y="215" text-anchor="middle">SW1 UP</text><text x="680" y="295" text-anchor="middle">SW2 DOWN</text><text x="680" y="375" text-anchor="middle">SW3 OK</text>
  </g>
  <text x="790" y="200" fill="#5f6a66" font-size="12">6 mm tactile switches,</text>
  <text x="790" y="216" fill="#5f6a66" font-size="12">normally open.</text>
  <text x="790" y="240" fill="#5f6a66" font-size="12">Pressed = pin pulled to GND</text>
  <text x="790" y="256" fill="#5f6a66" font-size="12">= LOW in firmware.</text>
  <text x="790" y="280" fill="#5f6a66" font-size="12">Keep on D0–D7 so any</text>
  <text x="790" y="296" fill="#5f6a66" font-size="12">press wakes it from sleep.</text>

  <!-- Power -->
  <g stroke="#1d2321" stroke-width="2" fill="none">
    <path d="M440 560 H470 M470 545 V575 M480 552 V568 M490 545 V575 M500 552 V568 M510 545 V575 M520 552 V568 M520 560 H560"/>
  </g>
  <text x="468" y="540" fill="#b91c1c" font-size="12">+</text>
  <use href="#vcc" x="440" y="560"/><text x="440" y="540" text-anchor="middle" fill="#b91c1c" font-size="12">+5V</text>
  <path d="M560 560 V566" stroke="#1d2321" stroke-width="2"/><use href="#gnd" x="560" y="566"/>
  <text x="495" y="600" text-anchor="middle" font-weight="bold" fill="#1d2321">BT1  3×AA (4.5 V)</text>
  <text x="495" y="616" text-anchor="middle" fill="#5f6a66" font-size="12">or just the Nano's USB from a power bank</text>

  <!-- Parts list -->
  <g font-size="12" fill="#1d2321">
    <text x="680" y="520" font-weight="bold">Parts</text>
    <text x="680" y="540">U1  Nano clone, CH340</text><text x="900" y="540" text-anchor="end">$2–4</text>
    <text x="680" y="558">U2  0.96" SSD1306 I2C</text><text x="900" y="558" text-anchor="end">$1.50–3</text>
    <text x="680" y="576">SW1–3  6 mm tactile</text><text x="900" y="576" text-anchor="end">&lt;$0.20</text>
    <text x="680" y="594" fill="#5f6a66">U3  BMP280 (optional)</text><text x="900" y="594" text-anchor="end" fill="#5f6a66">$1–2</text>
    <path d="M680 604 H900" stroke="#5f6a66"/>
    <text x="680" y="620" font-weight="bold">Core build</text><text x="900" y="620" text-anchor="end" font-weight="bold">≈ $5</text>
  </g>
</svg>
