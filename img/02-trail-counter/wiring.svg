<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="520" fill="#fbfaf6"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#222">Trail Tally — wiring</text>
  <text x="30" y="60" fill="#555">Pro Mini 3.3 V / 8 MHz + AM312 PIR + one button + one LED. Batteries go to VCC, not RAW.</text>

  <!-- Pro Mini -->
  <rect x="330" y="100" width="210" height="330" rx="8" fill="#1f5f8b"/>
  <text x="435" y="130" fill="#fff" font-weight="bold" text-anchor="middle">Pro Mini 3.3 V</text>
  <text x="435" y="148" fill="#cfe3f1" text-anchor="middle" font-size="12">ATmega328P · 8 MHz</text>
  <g fill="#fff" font-size="13">
    <text x="345" y="195">VCC</text>
    <text x="345" y="245">GND</text>
    <text x="345" y="380">FTDI header</text>
    <text x="525" y="195" text-anchor="end">D2  PIR</text>
    <text x="525" y="265" text-anchor="end">D3  button</text>
    <text x="525" y="335" text-anchor="end">D13  LED</text>
  </g>
  <text x="435" y="412" fill="#cfe3f1" text-anchor="middle" font-size="11.5">GND CTS VCC TXO RXI DTR</text>

  <!-- battery -->
  <rect x="40" y="160" width="180" height="110" rx="6" fill="#3b3b3b"/>
  <text x="130" y="192" fill="#fff" text-anchor="middle" font-weight="bold">2×AA holder</text>
  <text x="130" y="212" fill="#bbb" text-anchor="middle" font-size="12">with switch, 2.0–3.2 V</text>
  <text x="70" y="250" fill="#ff8a7a" font-weight="bold">+</text>
  <text x="70" y="262" fill="#bbb" font-size="11">red</text>
  <text x="180" y="250" fill="#9fd" font-weight="bold">−</text>
  <path d="M220 190 H330" stroke="#c0392b" stroke-width="3" fill="none"/>
  <path d="M220 240 H330" stroke="#222" stroke-width="3" fill="none"/>

  <!-- PIR -->
  <rect x="660" y="120" width="200" height="110" rx="6" fill="#f2f0ea" stroke="#999"/>
  <circle cx="710" cy="175" r="30" fill="#fff" stroke="#bbb"/>
  <text x="790" y="155" text-anchor="middle" font-weight="bold" fill="#222">AM312</text>
  <text x="790" y="175" text-anchor="middle" fill="#666" font-size="12">mini PIR</text>
  <text x="790" y="200" text-anchor="middle" fill="#666" font-size="11.5">VCC · OUT · GND</text>
  <path d="M540 190 H660" stroke="#e67e22" stroke-width="3" fill="none"/>
  <text x="600" y="182" fill="#e67e22" font-size="12" text-anchor="middle">OUT</text>
  <path d="M730 120 V88 H300 V190 H330" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <path d="M830 120 V76 H280 V240 H330" stroke="#222" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <text x="600" y="106" fill="#c0392b" font-size="12" text-anchor="middle">PIR VCC to VCC</text>
  <text x="840" y="72" fill="#222" font-size="12" text-anchor="end">PIR GND to GND</text>

  <!-- button -->
  <rect x="660" y="250" width="70" height="30" rx="4" fill="#444"/>
  <circle cx="695" cy="265" r="9" fill="#888"/>
  <path d="M540 260 H660" stroke="#2980b9" stroke-width="3" fill="none"/>
  <path d="M730 265 H820" stroke="#222" stroke-width="2" fill="none"/>
  <text x="560" y="292" fill="#666" font-size="12">button: other leg to GND, internal pull-up</text>

  <!-- LED -->
  <path d="M540 330 H600" stroke="#27ae60" stroke-width="3" fill="none"/>
  <rect x="600" y="322" width="44" height="16" rx="3" fill="#d9c08b"/>
  <text x="622" y="356" fill="#666" font-size="11.5" text-anchor="middle">330 Ω</text>
  <path d="M644 330 H668" stroke="#27ae60" stroke-width="3" fill="none"/>
  <path d="M668 318 L668 342 L690 330 Z" fill="#e74c3c"/>
  <path d="M690 318 V342" stroke="#e74c3c" stroke-width="3"/>
  <path d="M690 330 H820" stroke="#222" stroke-width="2" fill="none"/>
  <path d="M820 265 V360 M806 360 H834 M811 367 H829 M816 374 H824" stroke="#222" stroke-width="2" fill="none"/>
  <text x="840" y="345" fill="#222" font-size="12">GND</text>
  <text x="560" y="390" fill="#666" font-size="12">LED optional: the board's own D13 LED also works</text>

  <text x="30" y="508" fill="#555" font-size="12.5">Before you hang it: remove the power LED (or its resistor) to save ~1 mA, and power through VCC so the regulator isn't in the path.</text>
</svg>
