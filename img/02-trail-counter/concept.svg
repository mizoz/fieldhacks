<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5f6a66"/></marker></defs>
<rect width="1000" height="520" fill="#fbfaf6"/>
<text x="40" y="40" font-size="21" font-weight="bold" fill="#1d2321">Trail Tally · concept</text>
<text x="40" y="62" fill="#5f6a66">A $3 motion counter that sleeps for weeks and remembers which hours the trail gets used.</text>
<rect x="40" y="100" width="200" height="96" rx="10" fill="#eef3f6" stroke="#2f6f9f" stroke-width="1.5"/>
<text x="54" y="124" font-weight="bold" fill="#1d2321">PIR sensor</text>
<text x="54" y="146" fill="#5f6a66" font-size="12.5">AM312 / HC-SR501</text>
<text x="54" y="164" fill="#5f6a66" font-size="12.5">aimed down the trail</text>
<rect x="40" y="230" width="200" height="76" rx="10" fill="#eef3f6" stroke="#2f6f9f" stroke-width="1.5"/>
<text x="54" y="254" font-weight="bold" fill="#1d2321">2×AA</text>
<text x="54" y="276" fill="#5f6a66" font-size="12.5">months of standby</text>
<rect x="300" y="100" width="260" height="206" rx="10" fill="#fff" stroke="#1d2321" stroke-width="1.5"/>
<text x="314" y="124" font-weight="bold" fill="#1d2321">Pro Mini 3.3 V</text>
<text x="314" y="146" fill="#5f6a66" font-size="12.5">sleeps at microamps</text>
<text x="314" y="164" fill="#5f6a66" font-size="12.5">wakes on motion (interrupt)</text>
<text x="314" y="182" fill="#5f6a66" font-size="12.5">60 s lockout: one deer = one count</text>
<text x="314" y="200" fill="#5f6a66" font-size="12.5">watchdog keeps hour of day</text>
<text x="314" y="218" fill="#5f6a66" font-size="12.5">adds 1 to this hour's bin</text>
<text x="314" y="236" fill="#5f6a66" font-size="12.5">bins saved in EEPROM (~6 weeks)</text>
<text x="314" y="254" fill="#5f6a66" font-size="12.5">(battery dies, data stays)</text>
<rect x="40" y="340" width="520" height="130" rx="10" fill="#eef1ea" stroke="#4d7c0f" stroke-width="1.5"/>
<text x="54" y="364" font-weight="bold" fill="#1d2321">Reading it</text>
<text x="54" y="386" fill="#5f6a66" font-size="12.5">Plug in a $1 USB-serial adapter → CSV of counts per hour per day.</text>
<text x="54" y="404" fill="#5f6a66" font-size="12.5">tools/plot.py turns that into the 24-hour "deer clock" on the right.</text>
<text x="54" y="422" fill="#5f6a66" font-size="12.5">No adapter? Press the button and the LED blinks the busiest hour.</text>
