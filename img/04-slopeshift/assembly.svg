<text x="434" y="470" fill="#5f6a66" text-anchor="end" font-size="12">drain hole at the bottom</text>
<text x="560" y="642" fill="#1d2321" font-size="12.5">mast: stake or tripod, vane at nose height on the stand, clear of the trunk</text>
<rect x="830" y="380" width="240" height="210" rx="10" fill="#eef1ea" stroke="#3f6212"/>
<text x="846" y="406" fill="#3f6212" font-weight="bold" font-size="12.5">Mounting tips</text>
<text x="846" y="428" fill="#1d2321" font-weight="normal" font-size="12.5">· Keep it clear of the trunk and</text>
<text x="846" y="450" fill="#1d2321" font-weight="normal" font-size="12.5">  branches: they bend the wind</text>
<text x="846" y="472" fill="#1d2321" font-weight="normal" font-size="12.5">· Point the N reed north with a</text>
<text x="846" y="494" fill="#1d2321" font-weight="normal" font-size="12.5">  compass (vane N = magnet on N)</text>
<text x="846" y="516" fill="#1d2321" font-weight="normal" font-size="12.5">· Balance the vane on its shaft</text>
<text x="846" y="538" fill="#1d2321" font-weight="normal" font-size="12.5">· Light cups start in lighter wind</text>
<text x="846" y="560" fill="#1d2321" font-weight="normal" font-size="12.5">· Vane and cups ≥ 30 cm apart</text>
</svg>