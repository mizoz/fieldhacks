<text x="40" y="38" font-size="21" font-weight="bold" fill="#1d2321">How 8 reed switches read 16 directions</text>
<text x="40" y="60" fill="#5f6a66">A magnet on the vane shaft closes one switch, or two when it sits between them. Each combination gives a different resistance, so one analog pin reads the direction.</text>
