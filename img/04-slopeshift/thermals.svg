<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5f6a66"/></marker></defs>
<rect width="1100" height="560" fill="#fbfaf6"/>
<text x="40" y="38" font-size="21" font-weight="bold" fill="#1d2321">Slope winds through the day</text>
<text x="40" y="60" fill="#5f6a66">A ridge seen end-on, east slope on the right. Sun-warmed slopes pull air up; shaded and cooling slopes let it drain down. Typical pattern on a clear, calm-weather day.</text>
<rect x="40" y="90" width="500" height="210" rx="10" fill="#fff" stroke="#e3e1d8"/>
<text x="56" y="116" font-weight="bold" fill="#1d2321">Before sunrise</text>
<text x="56" y="134" fill="#5f6a66" font-size="12">both slopes cool: air drains downhill</text>
<path d="M90 280 L290 160 L490 280 Z" fill="#dfe7d5"/>
<circle cx="480" cy="166" r="10" fill="#cbd5e1"/>
<path d="M240 188 L140 248" stroke="#2f6f9f" stroke-width="4" marker-end="url(#a)"/>
<path d="M340 188 L440 248" stroke="#2f6f9f" stroke-width="4" marker-end="url(#a)"/>
<text x="100" y="296" fill="#5f6a66" font-size="11">west slope</text>
<text x="480" y="296" fill="#5f6a66" font-size="11" text-anchor="end">east slope</text>
<rect x="570" y="90" width="500" height="210" rx="10" fill="#fff" stroke="#e3e1d8"/>
<text x="586" y="116" font-weight="bold" fill="#1d2321">Mid-morning</text>
<text x="586" y="134" fill="#5f6a66" font-size="12">sun on the east slope: it switches first</text>
<path d="M620 280 L820 160 L1020 280 Z" fill="#dfe7d5"/>
<circle cx="1025" cy="168" r="14" fill="#f59e0b"/>
<path d="M770 188 L670 248" stroke="#2f6f9f" stroke-width="4" marker-end="url(#a)"/>
<path d="M970 248 L870 188" stroke="#b91c1c" stroke-width="4" marker-end="url(#a)"/>
<text x="630" y="296" fill="#5f6a66" font-size="11">west slope</text>
<text x="1010" y="296" fill="#5f6a66" font-size="11" text-anchor="end">east slope</text>
<rect x="40" y="320" width="500" height="210" rx="10" fill="#fff" stroke="#e3e1d8"/>
<text x="56" y="346" font-weight="bold" fill="#1d2321">Afternoon</text>
<text x="56" y="364" fill="#5f6a66" font-size="12">both slopes warm: air rises</text>
<path d="M90 510 L290 390 L490 510 Z" fill="#dfe7d5"/>
<circle cx="290" cy="372" r="14" fill="#f59e0b"/>
<path d="M140 478 L240 418" stroke="#b91c1c" stroke-width="4" marker-end="url(#a)"/>
<path d="M440 478 L340 418" stroke="#b91c1c" stroke-width="4" marker-end="url(#a)"/>
<text x="100" y="526" fill="#5f6a66" font-size="11">west slope</text>
<text x="480" y="526" fill="#5f6a66" font-size="11" text-anchor="end">east slope</text>
<rect x="570" y="320" width="500" height="210" rx="10" fill="#fff" stroke="#e3e1d8"/>
<text x="586" y="346" font-weight="bold" fill="#1d2321">Evening</text>
<text x="586" y="364" fill="#5f6a66" font-size="12">east slope shaded first: it switches back first</text>
<path d="M620 510 L820 390 L1020 510 Z" fill="#dfe7d5"/>
<circle cx="615" cy="430" r="12" fill="#fb923c"/>
<path d="M670 478 L770 418" stroke="#b91c1c" stroke-width="4" marker-end="url(#a)"/>
<path d="M870 418 L970 478" stroke="#2f6f9f" stroke-width="4" marker-end="url(#a)"/>
<text x="630" y="526" fill="#5f6a66" font-size="11">west slope</text>
<text x="1010" y="526" fill="#5f6a66" font-size="11" text-anchor="end">east slope</text>
<text x="40" y="548" fill="#1d2321" font-size="12.5">Blue = downslope (cooling, drains toward valleys).  Red = upslope (heating).  Cloud, strong prevailing wind or a front can override all of this.</text>
</svg>